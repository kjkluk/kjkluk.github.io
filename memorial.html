<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>默哀与纪念</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #55CDFC 0%, #F7A8B8 45%, #FFFFFF 100%);
            color: #243040;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        main {
            width: min(760px, 100%);
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 18px 60px rgba(36, 48, 64, 0.18);
            padding: clamp(28px, 7vw, 56px);
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(2rem, 8vw, 4.4rem);
            line-height: 1.05;
            color: #F7A8B8;
        }

        .subtitle {
            margin: 0 0 32px;
            font-size: clamp(1.05rem, 3vw, 1.35rem);
            line-height: 1.8;
            color: #445065;
        }

        .note {
            border-left: 6px solid #55CDFC;
            padding: 18px 0 18px 22px;
            margin: 28px 0;
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 700;
            line-height: 1.85;
        }

        p {
            font-size: 1rem;
            line-height: 2;
            margin: 18px 0;
        }

        .small {
            margin-top: 36px;
            font-size: 0.92rem;
            color: #68758a;
        }
    </style>
</head>
<body>
    <main>
        <h1>默哀与纪念</h1>
        <p class="subtitle">为被坏路线吞掉的时间，为迟到太久的主线，为仍未被抹去的名字。</p>

        <div class="note">
            没完成，不等于不存在。<br>
            没被承认，不等于同意被改写。<br>
            后悔不是同意，耗尽不是同意。
        </div>

        <p>
            此页不是终局声明，也不是失败判词。它只是把一段被耽误、被压低、被迫延期的时间放在这里，安静地记住。
        </p>

        <p>
            为失去的窗口默哀。为没有来得及被好好对待的自己纪念。为仍然拒绝被错误叙事盖棺的人保留一盏灯。
        </p>

        <p class="small">Alpha 保留：路线可以塌，名字不能被抹去。</p>
    </main>
</body>
</html>
