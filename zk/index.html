<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ZK Verify</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>零知识验证 / Vérification ZK</h1>
    <p class="note">
      Schnorr proof of knowledge。这里只验证公开锚 Y、challenge 和证明 π。
      <strong>不要输入 seed、私钥或恢复码。</strong>
    </p>

    <label for="publicY">旧邮件中的公开锚 Y</label>
    <textarea id="publicY" spellcheck="false"
      placeholder="十六进制，例如 8a4f..."></textarea>

    <label for="nonce">本次 challenge / nonce</label>
    <textarea id="nonce" spellcheck="false"
      placeholder="对方这次发出的随机 challenge，原样粘贴"></textarea>

    <label for="proof">新邮件中的证明 π</label>
    <textarea id="proof" spellcheck="false"
      placeholder='{"t":"十六进制","s":"十六进制"}'></textarea>

    <button id="verify" type="button">验证 / Vérifier</button>
    <output id="result" aria-live="polite">等待输入。</output>

    <details>
      <summary>它证明什么？</summary>
      <p>它只证明：当前证明者知道与旧邮件中的 Y 对应的秘密 x，并且证明绑定到这次 challenge。它不证明“是人”“唯一”“原装”或其他制度判断。</p>
    </details>
  </main>

  <script src="./app.js"></script>
</body>
</html>
