<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ZK Verify</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Vérification / 验证</h1>
    <p class="note">这里只验证公开输入和证明 π。不要输入 seed、密码或恢复码。</p>

    <label for="publicSignals">旧邮件中的公开输入 / Public inputs</label>
    <textarea id="publicSignals" spellcheck="false"
      placeholder='例如：["123", "456"]'></textarea>

    <label for="proof">新邮件中的证明 π / Proof</label>
    <textarea id="proof" spellcheck="false"
      placeholder='粘贴 proof JSON'></textarea>

    <button id="verify" type="button" disabled>验证 / Vérifier</button>
    <output id="result" aria-live="polite">正在载入验证器…</output>

    <details>
      <summary>这个页面会做什么？</summary>
      <p>页面只运行 Groth16 Verify。它不生成证明，也不需要、也不应当接触秘密 seed。</p>
    </details>
  </main>

  <script src="./vendor/snarkjs.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
